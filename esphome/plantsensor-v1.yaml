esphome:
  name: plantsensor-v1
  friendly_name: Plantsensor_V1
  min_version: 2025.11.0
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

logger:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

captive_portal:

# --------------------
# MQTT
# Topic: pflanzensensor/sensor/bodenfeuchtigkeit/state
# --------------------
mqtt:
  broker: !secret mqtt_broker
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: pflanzensensor

# --------------------
# Sensoren
# --------------------
sensor:

  # Bodenfeuchte Spannung (A0)
  # Der D1 mini hat einen Spannungsteiler am A0, daher x 3.3
  - platform: adc
    pin: A0
    name: "Soil Moisture Sensor Voltage"
    id: soil_moisture_voltage
    unit_of_measurement: "V"
    accuracy_decimals: 3
    update_interval: 60s
    filters:
      - multiply: 3.3

  # Bodenfeuchte %
  # Kalibrierung: Wert im Wasser -> 100, Wert in trockener Luft -> 0
  - platform: template
    name: "Bodenfeuchtigkeit"
    unit_of_measurement: "%"
    device_class: moisture
    accuracy_decimals: 0
    lambda: |-
      return id(soil_moisture_voltage).state;
    update_interval: 60s
    filters:
      - calibrate_linear:
          - 1.29 -> 100
          - 2.80 -> 0
      - lambda: |-
          if (x > 100) return 100;
          if (x < 0) return 0;
          return x;
